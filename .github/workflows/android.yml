name: Build Android app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Run unit tests and build the APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NowPlaying.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest NowPlaying.apk \
            --title "Android app (latest build)" \
            --notes "Built from commit $GITHUB_SHA" \
            --target "$GITHUB_SHA"
