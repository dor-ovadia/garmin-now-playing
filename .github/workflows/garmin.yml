name: Build Garmin watch face

on:
  push:
    paths:
      - 'garmin/**'
      - '.github/workflows/garmin.yml'
  workflow_dispatch:

env:
  CIQ_SDK_VERSION: '9.2.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install the Connect IQ SDK manager CLI
        run: go install github.com/lindell/connect-iq-sdk-manager-cli@latest

      - name: Download the Connect IQ SDK and the Venu 3 device files
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          CLI="$(go env GOPATH)/bin/connect-iq-sdk-manager-cli"
          "$CLI" agreement accept
          "$CLI" login
          "$CLI" sdk download "$CIQ_SDK_VERSION"
          "$CLI" sdk set "$CIQ_SDK_VERSION"
          "$CLI" device download --manifest=garmin/manifest.xml
          echo "CIQ_HOME=$("$CLI" sdk current-path)" >> "$GITHUB_ENV"

      - name: Restore the developer signing key
        env:
          CIQ_DEVELOPER_KEY: ${{ secrets.CIQ_DEVELOPER_KEY }}
        run: echo "$CIQ_DEVELOPER_KEY" | base64 -d > "$RUNNER_TEMP/developer_key.der"

      - name: Compile
        run: |
          mkdir -p out
          # .prg = direct install file for the Venu 3, .iq = package for the Connect IQ store
          "$CIQ_HOME/bin/monkeyc" -d venu3 -f garmin/monkey.jungle -o out/NowPlaying.prg -y "$RUNNER_TEMP/developer_key.der" -w
          "$CIQ_HOME/bin/monkeyc" -e -f garmin/monkey.jungle -o out/NowPlaying.iq -y "$RUNNER_TEMP/developer_key.der" -w

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/developer_key.der"

      - uses: actions/upload-artifact@v4
        with:
          name: garmin-now-playing
          path: out/NowPlaying.*
